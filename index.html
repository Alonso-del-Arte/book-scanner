<!DOCTYPE html>
<html lang="en">
	<head>
        <meta charset="utf-8" />
		<title>Book Scanner: Home</title>
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="author" content="Alonso del Arte with help from Christopher Del Duco" />
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
        <script type="application/javascript"> 
            
            var numInput, bookInfoDiv;

			function getCover() {
                let isbn_cover = document.getElementById("isbn").value;
                if (!isbn_cover || isbn_cover.length < 10) {
                    bookInfoDiv.innerHTML = "<div style='color: red'>Please enter a valid ISBN</div>";
                    return;
                }
                const coverUrl = `https://covers.openlibrary.org/b/isbn/${isbn_cover}-M.jpg`;
                const coverImg = "<img src='" + coverUrl + "' alt='Book Cover' style='max-width: 200px; border: 1px solid #ccc; margin-top: 10px;' />";
                bookInfoDiv.innerHTML = bookInfoDiv.innerHTML + coverImg;
            }
			
            async function lookUp() {
				let query_formatted = document.getElementById("query").value.replaceAll(' ', '+');
                try {
                    const response = await fetch(`https://openlibrary.org/search.json?q=${query_formatted}`);
                    const results = await response.json();
                    if (results.docs.length > 0) {
                        const book = results.docs[0];
                        const title = "<h2>" + book.title + "</h2>";
                        const author = "<h3>" + (book.author_name ? book.author_name[0] : 'Unknown') + "</h3>";
                        const isbn = "<p>ISBN: " + (book.isbn ? book.isbn[0] : 'N/A') + "</p>";
                        bookInfoDiv.innerHTML = title + author + isbn;
                    } else {
                        bookInfoDiv.innerHTML = "<div style='color: red'>No books found</div>";
                    }
                } catch (error) {
                    bookInfoDiv.innerHTML = "<div style='color: red'>Error: " + error + "</div>";
                }
            }
            
            // This function based on tutorial from
// https://www.linkedin.com/pulse/using-barcode-detection-api-build-browser-based-web-scanner-c3kge/
            async function scan() {
                const video = document.getElementById("video");
                const barcodeDetector = new BarcodeDetector({
                    formats: ["ean_13"]
                });
                try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream; 
    video.play();
    video.addEventListener("play", async () => {
        var keepLooking = true;
        while (keepLooking) {
            try {
                const barcodes = await barcodeDetector.detect(video); 
                if (barcodes.length > 0) {
                    numInput.value = barcodes[0].rawValue;
                    keepLooking = false;
                }
            } catch (err) {
                console.error("Error detecting barcode:", err);
            }
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        video.stop();
        video.style.display = "none";
    }
    );
  } catch (error) {
    console.error("Error accessing camera:", error);
    alert("Unable to access the camera. Please check permissions or run the code on a secure server.");
  }
}
            
            
            async function updateBookInfo() {
                const isbn = numInput.value;
                console.log(isbn);
                try {
                    const requestPath = 
                          "https://openlibrary.org/api/books?bibkeys=ISBN:" + 
                          isbn + "&jscmd=details&format=json";
                    const response = await fetch(requestPath);
                    const bookData = await response.json();
                    const key = "ISBN:" + isbn;
                    
                    if (bookData[key]) {
                        const details = bookData[key].details;
                        const titleLine = "<h2>" + details.title + "</h2>";
                        const authorLine = "<h3>" + (details.authors ? details.authors.map(a => a.name).join(', ') : 'Unknown') + "</h3>";
                        const publisherLine = "<p>Publisher: " + (details.publishers ? details.publishers[0] : 'Unknown') + "</p>";
                        const yearLine = "<p>Year: " + (details.publish_date ? details.publish_date : 'Unknown') + "</p>";
                        bookInfoDiv.innerHTML = titleLine + authorLine + publisherLine + yearLine;
                        getCover();
                    } else {
                        bookInfoDiv.innerHTML = "<div style='color: red'>Book not found for ISBN: " + isbn + "</div>";
                    }
                } catch (error) {
                    bookInfoDiv.innerHTML = "<div style='color: red'>Error: " + error + "</div>";
                }
            }
            
            function initialize() {
                numInput = document.forms["isbnInput"]["isbn"];
                bookInfoDiv = document.getElementById("bookInfo");
                const scanDisabled = !("BarcodeDetector" in window)
                document.getElementById("scan").disabled = scanDisabled;
                if (scanDisabled) {
                    document.getElementById("video").style = "display: none";
                }
            }
            
        </script>
	</head>
	<body onload="initialize()">

		<h1>Book Scanner</h1>
        <form name="isbnInput" action="">
            <label for="isbn">ISBN-13</label>
            <input name="isbn" id="isbn" type="number" maxlength="13" value="9780451524935" />
            <button id="scan" type="button" onclick="scan()">Scan</button>
            <button type="button" onclick="updateBookInfo()">Look Up</button>
        </form>
        <video id="video" autoplay></video>
                
        <div id="bookInfo">No book scanned yet</div>

	</body>
</html>
