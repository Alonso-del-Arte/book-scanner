<!DOCTYPE html>
<html lang="en">
	<head>
        <meta charset="utf-8" />
		<title>Book Scanner: Home</title>
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
        <script type="application/javascript"><!-- 
            
            var numInput, bookInfoDiv;

			async function getCover() {
                let isbn_cover = document.getElementById("isbn").value;
                const response = await fetch(`https://cover.openlibrary.org/b/isbn/${isbn_cover}-M.jpg`);
                return await response.json()
            }
			
            async function lookUp() {
				let query_formatted = document.getElementById("").value.replaceAll(' ', '+');
                const response = await fetch(`https://openlibrary.org/search.json?q=${query_formatted}`);
                return await response.json()
            }
            
            async function updateBookInfo() {
                const isbn = numInput.value;
                console.log(isbn);
                try {
                    const requestPath = 
                          "https://openlibrary.org/api/books?bibkeys=ISBN:" + 
                          isbn + "&jscmd=details&format=json";
                    const jsonHeading = "\"ISBN:" + isbn + "\"";
                    const bookDataRaw = await fetch(requestPath);
                    console.log(bookDataRaw);
                    const intermediate1 = JSON.stringify(bookDataRaw);
                    console.log(intermediate1);
                    const intermediate2 = intermediate1.substring(23);
                    console.log(intermediate2);
                    const bookData = JSON.parse(intermediate2);
                const titleLine = "<h2>" + bookData.details.title + "</h2>";
                const authorLine = "<h3>" + bookData.authors + "</h3>";
                bookInfoDiv.innerHTML = titleLine + authorLine
                } catch (error) {
                    bookInfoDiv.innerHTML = "<div style='color: red'>" + error + "</div>"
                }
            }
            
            function initialize() {
                numInput = document.forms["isbnInput"]["isbn"];
                bookInfoDiv = document.getElementById("bookInfo")
            }
            
        // --></script>
	</head>
	<body onload="initialize()">

		<h1>Book Scanner</h1>
       <div style="color: red; font-weight: bold">DRAFT</div>
<p>The idea is that this will be able to look up an ISBN that you type or that you scan with your phone's camera. But I'm stymied at how to even get data from Open Library without tripping up a bunch of CORS errors.</p> 
        <form name="isbnInput" action="">
			<input id="query" type="text" placeholder="Title or Author"/>
			<button type="button" onclick="lookUp()">Get Book Info by Title or Author</button>
            <label for="isbn">ISBN-13</label>
            <input name="isbn" id="isbn" type="number" maxlength="13" value="9780000000002" />
            <button type="button" onclick="updateBookInfo()">UpdateBookInfo</button>
			<button type="button" onclick="getCover()">Get Cover</button>
        </form>
        
        <div style="color: red; font-weight: bold">DRAFT</div>
        
        <div id="bookInfo">No book scanned yet</div>

	</body>
</html>
